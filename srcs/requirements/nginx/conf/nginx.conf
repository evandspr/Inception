server {
	# Uniquement le port 443, en HTTPS
	listen 443 ssl;
	listen [::]:443 ssl;

	# DOMAIN_NAME est remplace par la vraie valeur au demarrage (start.sh)
	server_name DOMAIN_NAME;

	ssl_certificate     /etc/nginx/ssl/inception.crt;
	ssl_certificate_key /etc/nginx/ssl/inception.key;
	# Uniquement TLS 1.2 et 1.3 (exige par le sujet)
	ssl_protocols       TLSv1.2 TLSv1.3;

	# Fichiers WordPress (meme volume que le conteneur wordpress)
	root  /var/www/html;
	index index.php index.html;

	location / {
		try_files $uri $uri/ /index.php?$args;
	}

	# Les fichiers .php sont envoyes a php-fpm, dans le conteneur wordpress
	location ~ \.php$ {
		try_files $uri =404;
		fastcgi_split_path_info ^(.+\.php)(/.+)$;
		fastcgi_pass wordpress:9000;
		fastcgi_index index.php;
		include fastcgi_params;
		fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
		fastcgi_param PATH_INFO $fastcgi_path_info;
	}
}
