[www]
user = www-data
group = www-data

; Ecoute sur le port 9000 de toutes les interfaces : NGINX (autre conteneur)
; envoie les requetes PHP ici via le reseau Docker
listen = 9000

pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Garde les variables d'environnement du conteneur accessibles a PHP
clear_env = no
